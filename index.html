<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard | Sign Up / Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Background weather elements -->
        <div class="weather-background">
            <div class="sun"></div>
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>
        </div>

        <!-- Main content -->
        <div class="auth-container">
            <!-- Header -->
            <header class="auth-header">
                <div class="logo">
                    <i class="fas fa-cloud-sun"></i>
                    <h1>Weather Dashboard</h1>
                </div>

            </header>

            <!-- Toggle between forms -->
            <div class="form-toggle">
                <button class="toggle-btn active" id="register-toggle">Create Account</button>
                <button class="toggle-btn" id="login-toggle">Sign In</button>
            </div>

            <!-- Registration Form -->
            <form class="auth-form active" id="register-form">
                <h2>Create Your Account</h2>
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                    </div>
                    <input type="text" id="reg-name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <input type="email" id="reg-email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" id="reg-password" placeholder="Password" required>
                    <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
                </div>
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" id="reg-confirm-password" placeholder="Confirm Password" required>
                    <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
                </div>
                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
                <div class="divider">
                </div>
            </form>

            <!-- Login Form -->
            <form class="auth-form" id="login-form">
                <h2>Welcome Back</h2>
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <input type="email" id="login-email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
                </div>
                <div class="form-options">
                    <div class="remember">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
                <div class="divider">
                </div>
            </form>

            <!-- Toggle link at bottom -->
            <div class="toggle-link">
                <p id="toggle-text">Already have an account? <a href="#" id="toggle-link">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <!-- Quick Access Button -->
    <div class="quick-access">
        <p>Already logged in? <a href="dashboard.html">Go to Dashboard</a></p>
    </div>

    
</body>


</html>
